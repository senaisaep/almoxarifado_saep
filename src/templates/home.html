<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Painel</title>
  </head>
  <body>
    <h1>Bem-vindo, {{ usuario.nome }}</h1>
    <p>Permissões: {{ usuario.permissoes | join(', ') }}</p>

    <ul>
      {% if 'estoque' in usuario.permissoes %}
        <li><a href="{{ url_for('sistema.painel_produtos') }}">Produtos</a></li>
        <li><a href="{{ url_for('sistema.registrar_produto') }}">Registrar produto</a></li>
        <li><a href="{{ url_for('sistema.retirar_produto') }}">Retirar produto</a></li>
      {% endif %}
      {% if 'relatorios' in usuario.permissoes %}
        <li><a href="{{ url_for('sistema.painel_relatorios') }}">Relatórios</a></li>
      {% endif %}
    </ul>

    <p><a href="{{ url_for('sistema.sair') }}">Sair</a></p>
  </body>
</html>
