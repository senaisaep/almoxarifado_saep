<html>
    <body>
        <h1>Registrar Produto</h1>
        <form action="/registrar" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao"></textarea><br><br>

            <label for="preco">Preço:</label>
            <input type="number" id="preco" name="preco" step="0.01" min="0" value="0"><br><br>

            <label for="quantidade_estoque">Quantidade:</label>
            <input type="number" id="quantidade_estoque" name="quantidade_estoque" min="0" value="0"><br><br>

            <input type="submit" value="Registrar">
        </form>
        <p><a href="/lista_produtos">Voltar para lista</a></p>
    </body>
</html>
